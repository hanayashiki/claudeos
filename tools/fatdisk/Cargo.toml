[package]
name = "fatdisk"
version = "0.1.0"
edition = "2021"
publish = false

# A host program and its tests, built for the Mac and never for the kernel.
# The library compiles the kernel's own FAT32 code, kernel/src/storage/fat/, by
# path, and the tests run it against images macOS's newfs_msdos made and check
# what it wrote with macOS's fsck_msdos and by mounting the image. No crate
# outside the standard library is used.
[dependencies]

# Built the way the kernel builds the same code: overflow checks on, so that an
# arithmetic wrap is a panic `fuzz` reports rather than a wrong number; and
# unwinding, so that `fuzz` can catch the panic and name the seed.
[profile.release]
overflow-checks = true
debug = true

[profile.test]
overflow-checks = true
