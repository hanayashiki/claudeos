[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
# SHA-1 on both machines, for the boot-time integrity check in
# src/integrity.rs, and on aarch64 for the WPA2 handshake as well.
#
# `force-soft`, because on x86 the crate otherwise asks the processor at run
# time whether it has the SHA instructions and uses them if it does. Those
# instructions use the vector registers, which this kernel is built without
# and does not save, so they would corrupt whatever program was interrupted.
# On aarch64 the crate has no hardware path without its `asm` feature, so the
# code it compiles there is the same either way.
sha1 = { version = "=0.10.7", default-features = false, features = ["force-soft"] }

# The rest of the WPA2 handshake: HMAC, PBKDF2, AES and AES key wrap. The
# driver exists only on aarch64, so these are compiled only there. Versions are
# pinned exactly; Cargo.lock pins what they depend on.
[target.'cfg(target_arch = "aarch64")'.dependencies]
hmac = { version = "=0.12.1", default-features = false }
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
aes = { version = "=0.8.4", default-features = false, features = ["zeroize"] }
aes-kw = { version = "=0.2.1", default-features = false }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
# An arithmetic wrap on a value that came from a file, a device or a program is
# how four bounds checks in the program loader were defeated. Every wrap this
# kernel means is already spelled `wrapping_*`, so turning these on costs
# nothing it wanted and turns the rest into a panic naming a file and a line,
# which on a board with only a serial cable is the difference between a
# diagnosis and a week.
overflow-checks = true
opt-level = 2
debug = true
lto = false
codegen-units = 1
